name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si subes otro commit a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://clinic:clinic@localhost:5432/clinic_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas Jest (unitarias + integración)
        run: npm run test:coverage

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage
          if-no-files-found: ignore

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Levantar la aplicación completa (Docker Compose)
        run: docker compose up -d --build

      - name: Pruebas Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          wait-on: "http://localhost:4000/api/health, http://localhost:3000"
          wait-on-timeout: 120

      - name: Guardar capturas de pantalla si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-capturas
          path: e2e/cypress/screenshots
          if-no-files-found: ignore

      - name: Mostrar logs de los contenedores si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v
