name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # botón "Run workflow" para volver a desplegar manualmente desde main

# Si subes otro commit a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://clinic:clinic@localhost:5432/clinic_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas Jest (unitarias + integración)
        run: npm run test:coverage

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage
          if-no-files-found: ignore

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Levantar la aplicación completa (Docker Compose)
        run: docker compose up -d --build

      - name: Pruebas Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          wait-on: "http://localhost:4000/api/health, http://localhost:3000"
          wait-on-timeout: 120

      - name: Guardar capturas de pantalla si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-capturas
          path: e2e/cypress/screenshots
          if-no-files-found: ignore

      - name: Mostrar logs de los contenedores si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

  # Despliegue continuo: solo corre en main, después de que AMBOS jobs de pruebas pasen.
  # Se activa creando la variable de repositorio DEPLOY_ENABLED=true (ver README).
  deploy:
    name: deploy
    needs: [backend-tests, e2e-tests]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Preparar base de datos (Neon)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npm run db:init

      - name: Desplegar backend (Render)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" -o /dev/null
          echo "Despliegue del commit ${GITHUB_SHA} solicitado a Render"

      - name: Esperar a que el backend nuevo esté en línea
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -sS --max-time 30 "${BACKEND_URL}/api/health" || true)
            echo "Intento ${i}/60: ${body}"
            if echo "${body}" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              echo "Backend en línea con el commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El backend no mostró el commit esperado en 10 minutos. Revisa el despliegue en el panel de Render."
          exit 1

      - name: Desplegar frontend (Vercel)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"
